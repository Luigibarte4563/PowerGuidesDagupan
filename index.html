<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101B2D" />
    <meta
      name="description"
      content="PowerGuide Dagupan - report and track power outages, floods and electrical hazards in Dagupan City."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Montserrat+Alternates:ital,wght@0,600;0,700;1,700&display=swap"
      rel="stylesheet"
    />
    <title>PowerGuide Dagupan | Report &amp; Track Power Outages</title>
    <script>
      /*
       * The app is permanently dark (Outages workspace look). Set the theme
       * before first paint so there is no light flash while React boots.
       * Kept in sync with src/context/ThemeContext.jsx.
       */
      (function () {
        document.documentElement.dataset.theme = 'dark';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#141527');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- leaflet.heat is a UMD plugin that mutates the global `L` (bridged in
       src/components/Map.jsx). Load it as a deferred global script so `L.heatLayer`
       exists before the heatmap layer mounts. -->
    <script src="/leaflet-heat.js" defer></script>
  </body>
</html>
